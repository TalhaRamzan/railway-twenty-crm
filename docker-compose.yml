# Local test stack that mirrors the Railway template:
#   twenty (server) + twenty-worker + Postgres + Redis + S3-compatible bucket.
#
# On Railway the bucket is a Railway Storage Bucket. Locally we use SeaweedFS
# as a stand-in S3 API (MinIO no longer publishes community images).
#
# Usage:
#   cp .env.example .env      # then fill in the secrets (see comments in .env.example)
#   docker compose up -d
#   open http://localhost:3000
#
# Every image is pinned by tag AND digest. Never use :latest.

name: twenty-crm-railway

x-twenty-image: &twenty-image twentycrm/twenty:v2.60.1@sha256:b190e54ca434ea1ee47fe73b8d76e77d0bf3c6f734fcec58e414108d6867939c

# Variables shared by server and worker (on Railway the worker references the server's values).
x-twenty-env: &twenty-env
  SERVER_URL: ${SERVER_URL:-http://localhost:3000}
  PG_DATABASE_URL: postgres://${PG_USER:-postgres}:${PG_PASSWORD:?set PG_PASSWORD in .env}@postgres:5432/${PG_DB:-twenty}
  REDIS_URL: redis://default:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
  APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
  STORAGE_TYPE: s3
  STORAGE_S3_NAME: ${S3_BUCKET:-twenty-files}
  STORAGE_S3_REGION: ${S3_REGION:-us-east-1}
  STORAGE_S3_ENDPOINT: http://seaweedfs:8333
  STORAGE_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
  STORAGE_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
  IS_MULTIWORKSPACE_ENABLED: "false"
  IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS: "true"
  EMAIL_DRIVER: ${EMAIL_DRIVER:-logger}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@example.com}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Twenty CRM}
  EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
  EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-465}
  EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
  EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
  TELEMETRY_ENABLED: "false"

services:
  twenty:
    image: *twenty-image
    stop_grace_period: 120s
    ports:
      - "3000:3000"
    environment:
      <<: *twenty-env
      PORT: "3000"
      NODE_PORT: "3000"
      # Server runs DB setup/migrations and registers cron jobs on every start.
      DISABLE_DB_MIGRATIONS: "false"
      DISABLE_CRON_JOBS_REGISTRATION: "false"
      NODE_OPTIONS: --max-old-space-size=1536
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bucket-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    restart: unless-stopped

  twenty-worker:
    image: *twenty-image
    # Same as the Railway start command: "/app/entrypoint.sh yarn worker:prod"
    entrypoint: ["/app/entrypoint.sh"]
    command: ["yarn", "worker:prod"]
    environment:
      <<: *twenty-env
      # Only the server migrates and registers crons.
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
      NODE_OPTIONS: --max-old-space-size=1024
    depends_on:
      twenty:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    # Same image Railway's managed PostgreSQL service uses, pinned.
    image: ghcr.io/railwayapp-templates/postgres-ssl:18.6@sha256:4fc833b43d2aaf6ecc9b18615f5533602b723a32d0e2efe2dae8ca0f7217c863
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
      POSTGRES_DB: ${PG_DB:-twenty}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DB:-twenty} -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.2.11@sha256:b0b01167ff47bc3868e56a967895a26be4230891a1f42a78ab61cdd227accc8d
    # Twenty's queue (BullMQ) needs maxmemory-policy=noeviction (Redis default).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--maxmemory-policy", "noeviction", "--save", "60", "1", "--dir", "/data"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    restart: unless-stopped

  # Local stand-in for the Railway Storage Bucket (S3 API on port 8333).
  seaweedfs:
    image: chrislusf/seaweedfs:4.54@sha256:4b42c212543a0acd4c0e675215ecdcaf62a186ef98def76c7e12701871222d15
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"twenty","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /data/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/data/s3.json
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - bucket-data:/data
    restart: unless-stopped

  # One-shot job: create the bucket (Railway creates it for you).
  bucket-init:
    image: amazon/aws-cli:2.41.2@sha256:7a77ccb39e3272191adbf905c50db8c127db88fd79454911a41a6b1c0e419e9b
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 60); do
          aws --endpoint-url http://seaweedfs:8333 s3api list-buckets >/dev/null 2>&1 && break
          echo "waiting for S3 endpoint..."; sleep 2
        done
        aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket "$$BUCKET" 2>/dev/null \
          || aws --endpoint-url http://seaweedfs:8333 s3api create-bucket --bucket "$$BUCKET"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      BUCKET: ${S3_BUCKET:-twenty-files}
    depends_on:
      - seaweedfs
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  bucket-data:
